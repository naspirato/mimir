version: 1

dataset:
  adapter: ydb
  adapter_config:
    wrapper_kwargs:
      config_path: detector/config/ydb_qa_config.json
      enable_statistics: true
    query: |
      SELECT 
        timestamp,
        cluster,
        warehouses,
        duration_seconds,
        git_branch,
        run_type,
        tpmC as metric_value,
        'tpmC' as metric_name
      FROM `perfomance/tpcc`
      WHERE timestamp >= CurrentUtcDate() - 180 * Interval("P1D")
      
      UNION ALL
      
      SELECT 
        timestamp,
        cluster,
        warehouses,
        duration_seconds,
        git_branch,
        run_type,
        newOrderLatency90 as metric_value,
        'newOrderLatency90' as metric_name
      FROM `perfomance/tpcc`
      WHERE timestamp >= CurrentUtcDate() - 180 * Interval("P1D")
        AND newOrderLatency90 IS NOT NULL;
    query_name: tpcc_performance_analysis
  timestamp_field: timestamp
  value_field: metric_value

analysis:
  # Группируем ряды по окружению и типу метрики
  context_fields: [cluster, warehouses, git_branch, run_type, metric_name]
  meta_fields: []
  metrics:
    name: tpcc_performance_analysis
    # В наборе смешаны метрики разной направленности (tpmC ↑ лучше, latency ↓ лучше).
    # На текущем этапе задаём общий режим; при необходимости разбивать конфиг по метрикам.
    direction: higher_is_better
    metric_kind: other
    auto_detect_metric_type: true
  event_types: [regression, improvement]
  output:
    debug: false

