<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>MiMiR</title>
    <link rel="icon" type="image/jpeg" href="{{ url_for('static', filename='mimir.jpeg') }}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <style>
      :root {
        --pico-font-size: 14px;
        --pico-line-height: 1.5;
        --pico-spacing: 0.75rem;
        --pico-form-element-spacing-vertical: 0.5rem;
        --pico-form-element-spacing-horizontal: 0.75rem;
      }
      body {
        padding: 1rem;
        max-width: 1200px;
        margin: 0 auto;
      }
      .step {
        margin-bottom: 2rem;
        padding: 1rem;
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 4px;
        background: var(--pico-card-background-color);
      }
      .step-header {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-bottom: 1rem;
      }
      .step-number {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--pico-primary-background);
        color: var(--pico-primary-inverse);
        font-size: 12px;
        font-weight: bold;
      }
      .step-number.completed {
        background: var(--pico-del-color);
      }
      .step-title {
        font-size: 16px;
        font-weight: 600;
        margin: 0;
      }
      .step-content {
        margin-top: 1rem;
      }
      .form-group {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 0.75rem;
        align-items: center;
        margin-bottom: 0.75rem;
      }
      .form-group label {
        font-weight: 500;
        margin: 0;
      }
      .form-group input, .form-group select {
        margin: 0;
      }
      .action-buttons {
        display: flex;
        gap: 0.5rem;
        margin-top: 1rem;
      }
      .status-badge {
        display: inline-block;
        padding: 0.25rem 0.5rem;
        border-radius: 3px;
        font-size: 12px;
        font-weight: 500;
      }
      .status-badge.success {
        background: #d1fae5;
        color: #065f46;
      }
      .status-badge.info {
        background: #dbeafe;
        color: #1e40af;
      }
      table {
        font-size: 13px;
      }
      table th {
        font-weight: 600;
        padding: 0.5rem;
      }
      table td {
        padding: 0.5rem;
      }
      .context-link {
        font-size: 12px;
      }
      #plots-section {
        margin-top: 2rem;
        padding: 1rem;
        border: 1px solid var(--pico-muted-border-color);
        border-radius: 4px;
        background: var(--pico-card-background-color);
      }
      .alert {
        padding: 0.75rem;
        border-radius: 4px;
        margin-bottom: 1rem;
      }
      .alert-success {
        background: #d1fae5;
        color: #065f46;
        border: 1px solid #6ee7b7;
      }
      .alert-error {
        background: #fee2e2;
        color: #991b1b;
        border: 1px solid #fca5a5;
      }
      .alert-warning {
        background: #fef3c7;
        color: #92400e;
        border: 1px solid #fde68a;
      }
      .loading-spinner {
        display: inline-block;
        width: 16px;
        height: 16px;
        border: 2px solid rgba(0, 0, 0, 0.1);
        border-radius: 50%;
        border-top-color: currentColor;
        animation: spin 0.6s linear infinite;
        vertical-align: middle;
        margin-right: 0.5rem;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      button:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      form.loading button[type="submit"] {
        position: relative;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <header style="margin-bottom: 2rem; display: flex; align-items: center; gap: 1rem;">
      <img src="{{ url_for('static', filename='mimir.jpeg') }}" alt="MiMiR" style="width: 48px; height: 48px; border-radius: 4px; object-fit: cover;">
      <div>
        <h1 style="margin: 0; font-size: 24px;">MiMiR</h1>
        <p style="margin: 0.5rem 0 0 0; color: var(--pico-muted-color); font-size: 14px;">Time series analysis tool</p>
      </div>
    </header>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="alert alert-{{ category if category in ['success', 'error', 'warning'] else 'info' }}">
            {{ message }}
          </div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    {% block content %}{% endblock %}
  </body>
</html>
