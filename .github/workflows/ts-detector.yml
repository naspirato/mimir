name: TS Detector V2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  ts-detector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Run example
        run: |
          cd examples
          python run_example.py
